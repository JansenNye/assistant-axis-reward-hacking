[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-axis-reward-hacking"
version = "0.1.0"
description = "Random-direction controls for Assistant Axis associations with reward hacking"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Jansen Nye"}]
dependencies = [
  "torch>=2.13,<3", "transformers>=5.17,<6", "accelerate>=1.15,<2",
  "numpy>=2.4,<3", "scipy>=1.18,<2", "matplotlib>=3.11,<4",
  "jaxtyping>=0.3.11,<1", "tqdm>=4.67,<5",
]

[project.optional-dependencies]
extraction = ["kernels>=0.16,<0.17"]

[project.urls]
Research = "https://jansennye.com/research/can-the-assistant-axis-predict-reward-hacking/"
Repository = "https://github.com/JansenNye/assistant-axis-reward-hacking"

[tool.setuptools.packages.find]
where = ["src"]
